[project]
name = "llm-c-from-scratch"
version = "0.1.0"
description = "Educational GPT / llm.c tutorial in Jupyter notebooks (PyTorch)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy",
    "torch",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "nbformat",
    "nbclient",
    "ipykernel",
]
gpt2 = [
    "tiktoken",
]

[tool.setuptools.packages.find]
include = ["llmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "E402"]
